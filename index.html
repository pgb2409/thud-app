<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thud - Transcripción Musical de Batería</title>
    
    <!-- OpenSheetMusicDisplay -->
    <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.5/build/opensheetmusicdisplay.min.js"></script>
    
    <!-- Cliente oficial de Gradio -->
    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";
        window.GradioClient = Client;
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px;
        }
        
        .upload-section {
            background: #f8f9fa;
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }
        
        .upload-section:hover {
            border-color: #764ba2;
            background: #f0f0f0;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .file-label {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: transform 0.2s ease;
        }
        
        .file-label:hover {
            transform: scale(1.05);
        }
        
        .file-name {
            margin-top: 15px;
            font-size: 1em;
            color: #666;
        }
        
        .process-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 30px auto;
        }
        
        .process-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .process-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #status {
            text-align: center;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            font-size: 1.1em;
            display: none;
        }
        
        #status.loading {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
            display: block;
        }
        
        #status.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
            display: block;
        }
        
        #status.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
            display: block;
        }
        
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #osmdCanvas {
            margin-top: 40px;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            min-height: 400px;
            overflow-x: auto;
        }
        
        .info-box {
            background: #e7f3ff;
            border-left: 5px solid #667eea;
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
        }
        
        .info-box h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .info-box ul {
            list-style: none;
            padding-left: 20px;
        }
        
        .info-box li:before {
            content: "✓ ";
            color: #667eea;
            font-weight: bold;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🥁 Thud</h1>
            <p>Transcripción Musical Inteligente de Batería</p>
        </div>
        
        <div class="content">
            <div class="info-box">
                <h3>📋 Instrucciones</h3>
                <ul>
                    <li>Sube un archivo de audio de batería (MP3, WAV, FLAC)</li>
                    <li>Haz clic en "Procesar Audio"</li>
                    <li>Espera 10-30 segundos</li>
                    <li>¡Visualiza tu partitura interactiva!</li>
                </ul>
            </div>
            
            <div class="upload-section">
                <label for="audioFile" class="file-label">
                    📁 Seleccionar Archivo de Audio
                </label>
                <input type="file" id="audioFile" accept="audio/*">
                <div id="fileName" class="file-name">Ningún archivo seleccionado</div>
            </div>
            
            <button id="processBtn" class="process-btn" disabled>
                🚀 Procesar Audio
            </button>
            
            <div class="loader" id="loader"></div>
            
            <div id="status"></div>
            
            <div id="osmdCanvas"></div>
        </div>
    </div>

    <script type="module">
        // ============================================================================
        // CONFIGURACIÓN Y VARIABLES GLOBALES
        // ============================================================================
        
        const audioFileInput = document.getElementById('audioFile');
        const fileNameDisplay = document.getElementById('fileName');
        const processBtn = document.getElementById('processBtn');
        const statusDiv = document.getElementById('status');
        const loader = document.getElementById('loader');
        const osmdCanvasDiv = document.getElementById('osmdCanvas');
        
        let selectedFile = null;
        let osmd = null;
        
        // ============================================================================
        // MANEJADOR DE SELECCIÓN DE ARCHIVO
        // ============================================================================
        
        audioFileInput.addEventListener('change', (event) => {
            selectedFile = event.target.files[0];
            
            if (selectedFile) {
                fileNameDisplay.textContent = `📄 ${selectedFile.name}`;
                processBtn.disabled = false;
            } else {
                fileNameDisplay.textContent = 'Ningún archivo seleccionado';
                processBtn.disabled = true;
            }
        });
        
        // ============================================================================
        // FUNCIÓN PRINCIPAL DE PROCESAMIENTO
        // ============================================================================
        
        processBtn.addEventListener('click', async () => {
            if (!selectedFile) {
                showStatus('⚠️ Por favor, selecciona un archivo de audio.', 'error');
                return;
            }
            
            // Deshabilitar botón y mostrar carga
            processBtn.disabled = true;
            loader.style.display = 'block';
            showStatus('🔄 Conectando con el servidor...', 'loading');
            osmdCanvasDiv.innerHTML = '';
            
            try {
                // ============================================================
                // PASO 1: Conectar con el backend de Gradio
                // ============================================================
                
                console.log('📡 Conectando con Hugging Face Space...');
                const client = await window.GradioClient.connect("pgb2409/thud-backend");
                console.log('✅ Conexión establecida');
                
                showStatus('🎵 Procesando audio... Esto puede tardar 10-30 segundos...', 'loading');
                
                // ============================================================
                // PASO 2: Enviar archivo y recibir resultado
                // ============================================================
                
                console.log('📤 Enviando archivo al backend...');
                
                const result = await client.predict("/procesar_audio", {
                    audio_path: selectedFile
                });
                
                console.log('📥 Respuesta recibida:', result);
                
                // ============================================================
                // PASO 3: Extraer datos de la respuesta
                // ============================================================
                
                // result.data es un array: [mensaje_texto, archivo_xml]
                const mensajeTexto = result.data[0];
                const archivoXML = result.data[1];
                
                console.log('📄 Mensaje:', mensajeTexto);
                console.log('🎼 Archivo XML:', archivoXML);
                
                // Verificar que recibimos el archivo XML
                if (!archivoXML || !archivoXML.url) {
                    throw new Error('No se recibió el archivo MusicXML del servidor.');
                }
                
                // ============================================================
                // PASO 4: Renderizar partitura con OSMD
                // ============================================================
                
                showStatus('🎼 Renderizando partitura...', 'loading');
                console.log('🎨 Cargando partitura en OSMD...');
                
                // Crear instancia de OSMD
                osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(osmdCanvasDiv, {
                    autoResize: true,
                    backend: "svg",
                    drawTitle: true,
                    drawSubtitle: false,
                    drawComposer: false,
                    drawingParameters: "compact"
                });
                
                // Cargar el archivo XML desde la URL
                const xmlUrl = archivoXML.url;
                console.log('🔗 URL del XML:', xmlUrl);
                
                await osmd.load(xmlUrl);
                console.log('✅ XML cargado');
                
                // Renderizar la partitura
                osmd.render();
                console.log('✅ Partitura renderizada');
                
                // ============================================================
                // PASO 5: Mostrar éxito
                // ============================================================
                
                showStatus(`✅ ¡Partitura generada exitosamente!\n\n${mensajeTexto}`, 'success');
                
                // Scroll suave hacia la partitura
                setTimeout(() => {
                    osmdCanvasDiv.scrollIntoView({ 
                        behavior: 'smooth', 
                        block: 'start' 
                    });
                }, 500);
                
            } catch (error) {
                console.error('❌ Error:', error);
                showStatus(`❌ Error durante el procesamiento:\n\n${error.message}`, 'error');
            } finally {
                // Ocultar loader y rehabilitar botón
                loader.style.display = 'none';
                processBtn.disabled = false;
            }
        });
        
        // ============================================================================
        // FUNCIÓN AUXILIAR PARA MOSTRAR MENSAJES
        // ============================================================================
        
        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = type;
        }
        
        // ============================================================================
        // INICIALIZACIÓN
        // ============================================================================
        
        console.log('🚀 Aplicación Thud inicializada');
        console.log('📚 OSMD version:', typeof opensheetmusicdisplay !== 'undefined' ? 'Cargado' : 'No cargado');
        console.log('📡 Gradio Client:', typeof window.GradioClient !== 'undefined' ? 'Cargado' : 'No cargado');
    </script>
</body>
</html>
