<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Thud App</title>
    <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.8/build/opensheetmusicdisplay.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-10">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold mb-5 text-cyan-400 font-mono italic">THUD</h1>
        <div class="bg-slate-800 p-6 rounded-2xl mb-10 border border-slate-700 shadow-2xl">
            <input type="file" id="audioInput" accept="audio/*" class="mb-4 block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-cyan-600 file:text-white hover:file:bg-cyan-500 cursor-pointer">
            <button onclick="procesar()" id="btn" class="bg-white text-slate-900 hover:bg-cyan-400 px-6 py-3 rounded-xl font-black transition w-full shadow-lg">GENERAR PARTITURA</button>
            <audio id="player" controls class="w-full mt-6 hidden"></audio>
        </div>
        <div id="osmdCanvas" class="bg-white rounded-2xl p-6 min-h-[500px] shadow-inner"></div>
    </div>
    <script>
        const osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay("osmdCanvas", { autoResize: true, drawTitle: false });
        async function procesar() {
            const fileInput = document.getElementById('audioInput');
            const btn = document.getElementById('btn');
            if (!fileInput.files[0]) return alert("Selecciona un audio primero");

            btn.innerText = "⏳ PROCESANDO EN HUGGING FACE...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('https://pgb2409-thud-backend.hf.space/process', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) throw new Error("El motor está arrancando, espera un momento.");

                const blob = await response.blob();
                const xmlText = await blob.text();
                
                await osmd.load(xmlText);
                osmd.render();
                
                const player = document.getElementById('player');
                player.src = URL.createObjectURL(fileInput.files[0]);
                player.classList.remove('hidden');
                btn.innerText = "✅ PARTITURA LISTA";
            } catch (e) {
                alert(e.message);
                btn.innerText = "❌ REINTENTAR";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
